<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>Ameryka P\u00f3\u0142nocna i Po\u0142udniowa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1f25;color:#ddd;overflow-x:hidden;}
.controls{display:flex;gap:6px;flex-wrap:wrap;padding:10px;position:sticky;top:0;background:#1a1f25;z-index:10;border-bottom:1px solid #333;}
.lb{font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;border:1px solid #555;background:transparent;color:#aaa;transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent;}
.lb.on{background:#1a3a5c;color:#6ab4f7;border-color:#2a5a8c;}
canvas{width:100%;display:block;touch-action:pan-x pan-y pinch-zoom;}
.legend{padding:10px;display:flex;flex-wrap:wrap;gap:8px;font-size:11px;border-top:1px solid #333;}
.legend-item{display:flex;align-items:center;gap:4px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
</style>
</head>
<body>
<div class="controls">
  <button onclick="tgl('mnt')" id="b-mnt" class="lb on">G&oacute;ry</button>
  <button onclick="tgl('plt')" id="b-plt" class="lb on">Wy&zdot;yny</button>
  <button onclick="tgl('low')" id="b-low" class="lb on">Niziny</button>
  <button onclick="tgl('riv')" id="b-riv" class="lb on">Rzeki</button>
  <button onclick="tgl('pen')" id="b-pen" class="lb on">P&oacute;&lstrok;wyspy</button>
  <button onclick="tgl('bay')" id="b-bay" class="lb on">Zatoki</button>
  <button onclick="tgl('isl')" id="b-isl" class="lb on">Wyspy</button>
  <button onclick="tgl('sea')" id="b-sea" class="lb on">Morza</button>
  <button onclick="tgl('lak')" id="b-lak" class="lb on">Jeziora</button>
  <button onclick="tgl('cap')" id="b-cap" class="lb on">Stolice</button>
</div>
<canvas id="cv"></canvas>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#e07848"></div>G&oacute;ry</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d4a850"></div>Wy&zdot;yny</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5cb85c"></div>Niziny</div>
  <div class="legend-item"><div class="legend-dot" style="background:#55aaee;width:16px;height:3px;border-radius:2px"></div>Rzeki</div>
  <div class="legend-item"><div class="legend-dot" style="border:2px solid #ee7755;background:transparent"></div>P&oacute;&lstrok;wyspy</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5599cc;opacity:.6"></div>Zatoki</div>
  <div class="legend-item"><div class="legend-dot" style="background:#cc88cc"></div>Wyspy</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4488cc"></div>Morza</div>
  <div class="legend-item"><div class="legend-dot" style="background:#44bbdd"></div>Jeziora</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff5555"></div>Stolice</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const dpr=window.devicePixelRatio||1;
const W=Math.min(window.innerWidth,800);
const H=Math.round(W*1.15);
const cv=document.getElementById('cv');
cv.width=W*dpr;cv.height=H*dpr;
cv.style.width=W+'px';cv.style.height=H+'px';
const c=cv.getContext('2d');c.scale(dpr,dpr);

const proj=d3.geoMercator().center([-72,-5]).scale(W*0.31).translate([W/2,H/2-H*0.03]);
const gp=d3.geoPath(proj,c);

const C={
  land:'#2c2c28',brd:'#555',ocean:'#1a1f25',
  mnt:'#e07848',plt:'#d4a850',low:'#5cb85c',
  riv:'#55aaee',pen:'#ee7755',bay:'#5599cc',
  isl:'#cc88cc',sea:'#4488cc',lak:'#44bbdd',
  cap:'#ff5555',capT:'#ffbbbb',
  bg:'rgba(28,28,26,.8)',
};

const L={mnt:1,plt:1,low:1,riv:1,pen:1,bay:1,isl:1,sea:1,lak:1,cap:1};
function tgl(k){L[k]=L[k]?0:1;document.getElementById('b-'+k).classList.toggle('on');draw();}

const mnt=[
  {n:'Kordyliery',la:45,lo:-115},{n:'G\u00f3ry Skaliste',la:50,lo:-114},
  {n:'G\u00f3ry Kaskadowe',la:47,lo:-121},{n:'Appalachy',la:37,lo:-80},
  {n:'Sierra Madre',la:24,lo:-104},{n:'G\u00f3ry Nabrze\u017cne',la:52,lo:-126},
  {n:'Andy',la:-15,lo:-72},{n:'G\u00f3ry Domeyki',la:-26,lo:-69.5},
];
const plt=[
  {n:'W. Meksyka\u0144ska',la:22,lo:-102},{n:'W. Kolorado',la:37,lo:-111},
  {n:'Wielkie R\u00f3wniny',la:42,lo:-101},{n:'Wielka Kotlina',la:40,lo:-117},
  {n:'W. Guja\u0144ska',la:4,lo:-62},{n:'W. Brazylijska',la:-14,lo:-47},
  {n:'W. Patago\u0144ska',la:-44,lo:-69},
];
const low=[
  {n:'N. Hudso\u0144ska',la:57,lo:-87},{n:'N. Zatokowa',la:30,lo:-92},
  {n:'N. Atlantycka',la:33,lo:-78},{n:'N. Amazonki',la:-3,lo:-60},
  {n:'N. Orinoko',la:7,lo:-67},{n:'N. La Platy',la:-33,lo:-60},
];
const riv=[
  {n:'Missisipi',p:[[-90,47],[-90,42],[-91,38],[-90,34],[-89,29]]},
  {n:'Mackenzie',p:[[-115,55],[-120,60],[-130,65],[-135,68]]},
  {n:'Rz. \u015aw. Wawrzy\u0144ca',p:[[-75,45],[-70,47],[-65,48],[-60,49]]},
  {n:'Jukon',p:[[-135,60],[-145,62],[-155,63],[-163,63]]},
  {n:'Kolorado',p:[[-110,39],[-112,36],[-114,33],[-115,32]]},
  {n:'Rio Grande',p:[[-106,36],[-104,32],[-100,29],[-97,26]]},
  {n:'Amazonka',p:[[-73,-5],[-65,-3],[-58,-2],[-52,-1],[-49,-1]]},
  {n:'Orinoko',p:[[-65,4],[-67,7],[-63,8],[-61,9]]},
  {n:'Parana',p:[[-54,-25],[-57,-28],[-58,-32],[-59,-34]]},
  {n:'Paragwaj',p:[[-57,-18],[-58,-22],[-57,-25],[-58,-27]]},
  {n:'S\u00e3o Francisco',p:[[-44,-10],[-42,-12],[-40,-14],[-38,-16],[-36,-11]]},
];
const pen=[
  {n:'Alaska',la:63,lo:-153},{n:'Labrador',la:55,lo:-60},
  {n:'Kalifornijski',la:28,lo:-113},{n:'Floryda',la:27,lo:-81.5},
  {n:'Jukatan',la:19.5,lo:-89},
];
const bay=[
  {n:'Zat. Alaska',la:57,lo:-148},{n:'Zat. Meksyka\u0144ska',la:25,lo:-90},
  {n:'Zat. Hudsona',la:60,lo:-84},{n:'Zat. Kalifornijska',la:27,lo:-111},
  {n:'Zat. Panamska',la:7.5,lo:-79},{n:'Zat. La Plata',la:-35,lo:-56},
];
const isl=[
  {n:'Kuba',la:21.5,lo:-79},{n:'Haiti',la:19,lo:-72},
  {n:'Hawaje',la:20,lo:-156},{n:'Bahamy',la:25,lo:-77},
  {n:'Ziemia Baffina',la:68,lo:-72},{n:'Grenlandia',la:72,lo:-42},
  {n:'Nowa Funlandia',la:49,lo:-56},{n:'Ziemia Ognista',la:-54,lo:-69},
  {n:'Falklandy/Malwiny',la:-52,lo:-59},{n:'Ma\u0142e Antyle',la:15,lo:-61},
  {n:'Galapagos',la:-1,lo:-90},
];
const sea=[
  {n:'M. Karaibskie',la:15,lo:-75},{n:'M. Sargassowe',la:28,lo:-55},
  {n:'M. Beauforta',la:72,lo:-140},{n:'M. Baffina',la:73,lo:-62},
];
const lak=[
  {n:'Jez. G\u00f3rne',la:47.5,lo:-87},{n:'Michigan',la:44,lo:-87},
  {n:'Huron',la:45,lo:-82},{n:'Erie',la:42,lo:-81},
  {n:'Wlk. Nied\u017awiedzie',la:65,lo:-121},{n:'Wlk. Niewolnicze',la:62,lo:-114},
  {n:'Winnipeg',la:52,lo:-98},{n:'Maracaibo',la:9.8,lo:-71.5},
  {n:'Titicaca',la:-16,lo:-69},
];
const cap={
  'Kanada':['Ottawa',45.4,-75.7],'USA':['Waszyngton',38.9,-77],
  'Meksyk':['Meksyk',19.4,-99.1],'Gwatemala':['Gwatemala',14.6,-90.5],
  'Belize':['Belmopan',17.2,-88.8],'Honduras':['Tegucigalpa',14.1,-87.2],
  'Salwador':['San Salvador',13.7,-89.2],'Nikaragua':['Managua',12.1,-86.3],
  'Kostaryka':['San Jos\u00e9',9.9,-84.1],'Panama':['Panama',9,-79.5],
  'Kolumbia':['Bogota',4.7,-74.1],'Wenezuela':['Caracas',10.5,-66.9],
  'Gujana':['Georgetown',6.8,-58.2],'Surinam':['Paramaribo',5.8,-55.2],
  'Gujana Fr.':['Kajenna',4.9,-52.3],'Brazylia':['Bras\u00edlia',-15.8,-47.9],
  'Ekwador':['Quito',-0.2,-78.5],'Peru':['Lima',-12,-77],
  'Boliwia':['La Paz',-16.5,-68.1],'Chile':['Santiago',-33.4,-70.6],
  'Argentyna':['Buenos Aires',-34.6,-58.4],'Urugwaj':['Montevideo',-34.9,-56.2],
  'Paragwaj':['Asunci\u00f3n',-25.3,-57.6],'Jamajka':['Kingston',18,-76.8],
  'Haiti':['Port-au-Prince',18.5,-72.3],'Dominikana':['Santo Domingo',18.5,-69.9],
  'Trynidad':['Port of Spain',10.7,-61.5],'Kuba':['Hawana',23.1,-82.4],
  'Bahamy':['Nassau',25,-77.3],
};

let wd=null;
const loading=document.createElement('div');
loading.style.cssText='text-align:center;padding:40px;color:#888;';
loading.textContent='\u0141adowanie mapy...';
cv.parentNode.insertBefore(loading,cv);

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(r=>r.json()).then(d=>{wd=d;loading.remove();draw();})
  .catch(()=>{loading.textContent='B\u0142\u0105d \u0142adowania mapy. Sprawd\u017a po\u0142\u0105czenie z internetem.';});

const fs=Math.max(7,Math.round(W/85));
const fss=Math.max(6,fs-1);
const fcap=Math.max(6,fs-2);

function draw(){
  c.clearRect(0,0,W,H);
  c.fillStyle=C.ocean;c.fillRect(0,0,W,H);
  if(!wd)return;
  const land=topojson.feature(wd,wd.objects.countries);
  const am=land.features.filter(f=>{const g=d3.geoCentroid(f);return g[0]>-170&&g[0]<-30&&g[1]>-60&&g[1]<85;});

  c.fillStyle='#222';c.strokeStyle='#333';c.lineWidth=0.3;
  land.features.forEach(f=>{c.beginPath();gp(f);c.fill();c.stroke();});
  c.fillStyle=C.land;c.strokeStyle=C.brd;c.lineWidth=0.5;
  am.forEach(f=>{c.beginPath();gp(f);c.fill();c.stroke();});

  if(L.mnt) mnt.forEach(m=>{const[x,y]=proj([m.lo,m.la]);tri(x,y,C.mnt);lbl(m.n,x+6,y-2,C.mnt,fs);});
  if(L.plt) plt.forEach(p=>{const[x,y]=proj([p.lo,p.la]);c.fillStyle=C.plt;c.globalAlpha=.35;c.beginPath();c.ellipse(x,y,14,8,0,0,Math.PI*2);c.fill();c.globalAlpha=1;lbl(p.n,x,y-10,C.plt,fss);});
  if(L.low) low.forEach(l=>{const[x,y]=proj([l.lo,l.la]);c.fillStyle=C.low;c.globalAlpha=.3;c.beginPath();c.ellipse(x,y,12,7,0,0,Math.PI*2);c.fill();c.globalAlpha=1;lbl(l.n,x,y-9,C.low,fss);});
  if(L.riv) riv.forEach(r=>{c.strokeStyle=C.riv;c.lineWidth=1.4;c.lineCap='round';c.lineJoin='round';c.beginPath();r.p.forEach((p,i)=>{const[x,y]=proj(p);i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();const m=r.p[Math.floor(r.p.length/2)];const[mx,my]=proj(m);lbl(r.n,mx,my-5,C.riv,fss);});
  if(L.pen) pen.forEach(p=>{const[x,y]=proj([p.lo,p.la]);c.strokeStyle=C.pen;c.lineWidth=1.5;c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.stroke();lbl(p.n,x+7,y-1,C.pen,fss);});
  if(L.bay) bay.forEach(b=>{const[x,y]=proj([b.lo,b.la]);c.fillStyle=C.bay;c.globalAlpha=.4;c.beginPath();c.arc(x,y,6,0,Math.PI*2);c.fill();c.globalAlpha=1;lbl(b.n,x,y-8,C.bay,fss);});
  if(L.isl) isl.forEach(i=>{const[x,y]=proj([i.lo,i.la]);c.fillStyle=C.isl;c.beginPath();c.arc(x,y,3,0,Math.PI*2);c.fill();lbl(i.n,x+5,y-1,C.isl,fss);});
  if(L.sea) sea.forEach(s=>{const[x,y]=proj([s.lo,s.la]);c.font='italic '+fss+'px sans-serif';c.fillStyle=C.sea;c.textAlign='center';c.fillText(s.n,x,y);c.textAlign='start';});
  if(L.lak) lak.forEach(l=>{const[x,y]=proj([l.lo,l.la]);c.fillStyle=C.lak;c.beginPath();c.ellipse(x,y,3.5,2.5,0,0,Math.PI*2);c.fill();lbl(l.n,x+5,y+1,C.lak,fss-1);});
  if(L.cap) Object.entries(cap).forEach(([k,v])=>{const[x,y]=proj([v[2],v[1]]);c.fillStyle=C.cap;c.beginPath();c.arc(x,y,2,0,Math.PI*2);c.fill();c.font=fcap+'px sans-serif';c.fillStyle=C.capT;c.fillText(v[0],x+3,y+3);});
}
function tri(x,y,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y-5);c.lineTo(x-4,y+3);c.lineTo(x+4,y+3);c.closePath();c.fill();}
function lbl(t,x,y,col,sz){c.font=(sz||8)+'px sans-serif';const w=c.measureText(t).width;c.fillStyle=C.bg;c.fillRect(x-1,y-sz+1,w+2,sz+2);c.fillStyle=col;c.textAlign='start';c.fillText(t,x,y);}

window.addEventListener('resize',()=>{
  const nw=Math.min(window.innerWidth,800);
  const nh=Math.round(nw*1.15);
  cv.width=nw*dpr;cv.height=nh*dpr;
  cv.style.width=nw+'px';cv.style.height=nh+'px';
  c.setTransform(dpr,0,0,dpr,0,0);
  proj.scale(nw*0.31).translate([nw/2,nh/2-nh*0.03]);
  draw();
});
</script>
</body>
</html>
