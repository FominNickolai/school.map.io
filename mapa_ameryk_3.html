<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Ameryki Północnej i Południowej</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; }

  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }

  .legend {
    position: fixed; top: 12px; right: 12px; z-index: 1000;
    background: rgba(255,255,255,0.96); border-radius: 12px;
    padding: 16px 18px; box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    max-height: calc(100vh - 24px); overflow-y: auto;
    min-width: 220px; backdrop-filter: blur(8px);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .legend h2 {
    font-size: 15px; margin-bottom: 12px; color: #1a1a2e;
    border-bottom: 2px solid #e0e0e0; padding-bottom: 8px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; cursor: pointer; user-select: none;
    transition: opacity 0.2s;
  }
  .legend-item:hover { opacity: 0.8; }
  .legend-item.disabled { opacity: 0.35; }
  .legend-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.15); flex-shrink: 0;
  }
  .legend-line {
    width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0;
  }
  .legend-label { font-size: 13px; color: #333; font-weight: 500; }
  .legend-count { font-size: 11px; color: #999; margin-left: auto; }

  .legend-toggle {
    display: none;
    position: fixed; z-index: 1001;
    bottom: 16px; right: 16px;
    width: 48px; height: 48px; border-radius: 50%;
    background: #1a1a2e; color: #fff; border: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    font-size: 22px; cursor: pointer;
    align-items: center; justify-content: center;
    transition: transform 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .legend-toggle:active { transform: scale(0.9); }

  .title-bar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: rgba(255,255,255,0.96);
    border-radius: 12px; padding: 10px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    backdrop-filter: blur(8px); text-align: center;
    max-width: calc(100vw - 24px);
  }
  .title-bar h1 { font-size: 16px; color: #1a1a2e; font-weight: 700; }
  .title-bar p { font-size: 11px; color: #666; margin-top: 2px; }

  .leaflet-tooltip.category-label {
    background: transparent; border: none; box-shadow: none;
    font-weight: 700; padding: 0; white-space: nowrap;
  }

  @media (max-width: 768px) {
    .title-bar {
      top: 8px; padding: 8px 16px; border-radius: 10px;
    }
    .title-bar h1 { font-size: 13px; }
    .title-bar p { font-size: 10px; }

    .legend-toggle { display: flex; }

    .legend {
      position: fixed; top: auto; right: 0; left: 0; bottom: 0;
      border-radius: 16px 16px 0 0; min-width: unset;
      max-height: 55vh; padding: 12px 16px 20px;
      transform: translateY(100%); opacity: 0;
      pointer-events: none;
    }
    .legend.open {
      transform: translateY(0); opacity: 1;
      pointer-events: auto;
    }
    .legend h2 {
      font-size: 14px; margin-bottom: 8px; padding-bottom: 6px;
      text-align: center;
    }
    .legend h2::before {
      content: ''; display: block;
      width: 36px; height: 4px; border-radius: 2px;
      background: #ccc; margin: 0 auto 8px;
    }
    .legend-item { padding: 7px 0; }
    .legend-dot { width: 16px; height: 16px; }
    .legend-label { font-size: 14px; }
    .legend-count { font-size: 12px; }

    .leaflet-tooltip.category-label { font-size: 11px; }
  }

  @media (max-width: 400px) {
    .title-bar h1 { font-size: 12px; }
    .title-bar p { display: none; }
    .legend { max-height: 50vh; }
  }

});

legendToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  legendOpen = !legendOpen;
  legendEl2.classList.toggle('open', legendOpen);
  legendToggle.textContent = legendOpen ? '✕' : '☰';
});

document.addEventListener('click', (e) => {
  if (legendOpen && !legendEl2.contains(e.target) && e.target !== legendToggle) {
    legendOpen = false;
    legendEl2.classList.remove('open');

Object.entries(data).forEach(([category, items]) => {
  const color = COLORS[category];
  const group = L.layerGroup();

  items.forEach(item => {
    const marker = L.marker([item.lat, item.lng], { icon: ICONS[category] });
    marker.bindPopup(`
      <div style="min-width:180px">
        <strong style="font-size:14px;color:${color}">${item.name}</strong>
        <div style="font-size:11px;color:#666;margin-top:2px">${category}</div>
        <div style="margin-top:6px;font-size:12px;line-height:1.4">${item.desc}</div>
      </div>
    `);
    marker.bindTooltip(item.name, {
      permanent: true,
      direction: 'right',
      offset: [8, 0],
      className: 'category-label',
      opacity: 1
    }).getTooltip().getElement && null;

    marker.on('add', function() {
      const tt = this.getTooltip();
      if (tt && tt.getElement) {
        setTimeout(() => {
          const el = tt.getElement();
          if (el) el.style.color = color;
        }, 10);
      }
    });

    group.addLayer(marker);
  });

  group.addTo(map);
  layerGroups[category] = group;

  const legendItem = document.createElement('div');
  legendItem.className = 'legend-item';
  const dotStyle = category === 'Stolice'
    ? `background:${color};clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);border:none;`
    : `background:${color}`;
  legendItem.innerHTML = `
    <div class="legend-dot" style="${dotStyle}"></div>
    <span class="legend-label">${category}</span>
    <span class="legend-count">${items.length}</span>
  `;
  legendItem.addEventListener('click', () => {
    if (map.hasLayer(layerGroups[category])) {
      map.removeLayer(layerGroups[category]);
      if (riverLayerGroups[category]) map.removeLayer(riverLayerGroups[category]);
      legendItem.classList.add('disabled');
    } else {
      map.addLayer(layerGroups[category]);
      if (riverLayerGroups[category]) map.addLayer(riverLayerGroups[category]);
      legendItem.classList.remove('disabled');
    }
  });
  legendEl.appendChild(legendItem);
});

const riverLayerGroups = {};

const riverGroup = L.layerGroup();
rivers.forEach(r => {
  const polyline = L.polyline(r.coords, {
    color: r.color, weight: 2.5, opacity: 0.7,
    dashArray: null, smoothFactor: 1.5
  });
  polyline.bindPopup(`<strong style="color:#1E90FF">${r.name}</strong><div style="font-size:11px;color:#666">Rzeka</div>`);
  riverGroup.addLayer(polyline);
});
riverGroup.addTo(map);
riverLayerGroups['Rzeki'] = riverGroup;

const mountainGroup = L.layerGroup();
mountainRanges.forEach(m => {
  const polyline = L.polyline(m.coords, {
    color: m.color, weight: 3, opacity: 0.5,
    dashArray: '6,4', smoothFactor: 1.5
  });
  polyline.bindPopup(`<strong style="color:#8B4513">${m.name}</strong><div style="font-size:11px;color:#666">Góry</div>`);
  mountainGroup.addLayer(polyline);
});
mountainGroup.addTo(map);
riverLayerGroups['Góry'] = mountainGroup;

setTimeout(() => {
  Object.values(layerGroups).forEach(group => {
    group.eachLayer(layer => {
      const tt = layer.getTooltip();
      if (tt) {
        const el = tt.getElement();
        if (el) {
          const cat = Object.entries(layerGroups).find(([,g]) => g.hasLayer(layer));
          if (cat) el.style.color = COLORS[cat[0]];
        }
      }
    });
  });
}, 500);
</script>
</body>
</html>
